name: Build global arm64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      # 固定签名密钥（仓库 Secret KEYSTORE_BASE64），保证每次构建的 APK 签名一致，
      # 之后可以直接覆盖安装，不必先卸载
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build global release
        env:
          KEYSTORE_FILE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: lospoofer
          KEY_ALIAS: lospoofer
          KEY_PASSWORD: lospoofer
        run: ./gradlew --no-daemon :app:assembleGlobalRelease

      - uses: actions/upload-artifact@v4
        with:
          name: LocationSpoofer-global-arm64
          path: app/build/outputs/apk/global/release/*.apk
          if-no-files-found: error
